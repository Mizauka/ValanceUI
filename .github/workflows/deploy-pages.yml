name: Deploy Demo & Blog Template to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Build Vue library & VitePress theme
        run: pnpm build:vue && pnpm build:theme

      - name: Build Component Demo & Blog Template for GitHub Pages
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITEPRESS_BASE: /${{ github.event.repository.name }}/blog/
        run: |
          pnpm build:demo
          pnpm build:blog
          rm -rf pages-dist
          mkdir -p pages-dist/blog
          cp -r apps/demo/dist/* pages-dist/
          cp -r apps/blog-template/docs/.vitepress/dist/* pages-dist/blog/
          touch pages-dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
