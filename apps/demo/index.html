<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F4EF" />
    <title>Valance UI · 扁平几何设计系统与组件库演示</title>
    <script>
      (() => {
        try {
          const pref = localStorage.getItem('vl-demo-theme') || 'system';
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme =
            pref === 'dark' || pref === 'light' ? pref : prefersDark ? 'dark' : 'light';
          const accent = localStorage.getItem('vl-demo-accent') || 'default';
          document.documentElement.dataset.accent = accent === 'swapped' ? 'swapped' : 'default';
          const locPref = localStorage.getItem('valance-locale-preference') || 'system';
          const mapLoc = (raw) => {
            const low = String(raw || '').toLowerCase();
            if (low.startsWith('ja')) return 'ja';
            if (low.startsWith('zh-tw') || low.startsWith('zh-hk') || low.startsWith('zh-mo') || low.includes('hant')) return 'zh-TW';
            if (low.startsWith('zh')) return 'zh-CN';
            return 'en';
          };
          const resolvedLoc =
            locPref === 'zh-CN' || locPref === 'zh-TW' || locPref === 'en' || locPref === 'ja'
              ? locPref
              : mapLoc((navigator.languages && navigator.languages[0]) || navigator.language || 'zh-CN');
          document.documentElement.lang = resolvedLoc;
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
